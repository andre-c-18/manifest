<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Live Manifest Karyawan</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <style>
    body {
      background-color: #f1f5f9;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .login-card {
      width: 100%;
      max-width: 400px;
      border: none;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.05);
    }
    .brand-header {
      background: linear-gradient(135deg, #1e3a8a 0%, #0f4c81 100%);
      color: white;
      text-align: center;
      padding: 30px 20px;
      border-radius: 12px 12px 0 0;
    }
  </style>
</head>
<body>

  <div class="card login-card">
    <div class="brand-header">
      <i class="bi bi-shield-lock fs-1"></i>
      <h4 class="mt-2 fw-bold">Manifest Ceres</h4>
      <small class="opacity-75">Manifest Karyawan On-Site</small>
    </div>
    <div class="card-body p-4">
      
      {% if error %}
      <div class="alert alert-danger py-2 small fw-semibold text-center" role="alert">
        <i class="bi bi-exclamation-triangle-fill me-1"></i> {{ error }}
      </div>
      {% endif %}

      <form action="/login" method="POST">
        <div class="mb-3">
          <label class="form-label small fw-semibold text-muted">Username</label>
          <div class="input-group">
            <span class="input-group-text bg-white"><i class="bi bi-person"></i></span>
            <input type="text" name="username" class="form-control border-start-0 ps-0" required autofocus>
          </div>
        </div>
        <div class="mb-4">
          <label class="form-label small fw-semibold text-muted">Password</label>
          <div class="input-group">
            <span class="input-group-text bg-white"><i class="bi bi-key"></i></span>
            <input type="password" name="password" class="form-control border-start-0 ps-0" required>
          </div>
        </div>
        <button type="submit" class="btn btn-primary w-100 fw-bold shadow-sm">
          Masuk
        </button>
      </form>
    </div>
  </div>

</body>
</html>
